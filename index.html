<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoSAA College Predictor 2024</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 0; margin: 0; background: #f9f9f9; }
    header {
      background: #4CAF50;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    header img {
      height: 50px;
      border-radius: 50%;
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    header p {
      margin: 0;
      font-size: 1rem;
      font-weight: 300;
    }
    form {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    #results {
      margin-top: 30px;
      padding: 0 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: #eee;
    }
    #downloadBtn, #downloadExcelBtn {
      display: none;
      margin: 20px auto;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      padding: 10px;
      width: 200px;
      font-weight: bold;
    }
    #searchInput {
      width: 100%;
      padding: 10px;
      margin: 20px auto;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Logo" />
    <div>
      <h1>JoSAA College Predictor 2024</h1>
      <p>Get your eligible NITs, IIITs & GFTIs based on your JEE Main Rank</p>
    </div>
  </header>
  <form id="predictor-form">
    <input type="text" id="username" placeholder="Enter your Name" required />
    <input type="number" id="rank" placeholder="Enter your JEE Rank" required />
    <select id="category"></select>
    <select id="gender">
      <option value="">Select Gender</option>
      <option value="Gender-Neutral">Gender-Neutral</option>
      <option value="Female-Only (including Supernumerary)">Female Only</option>
    </select>
    <select id="homeState"></select>
    <select id="round">
      <option value="">Select Round</option>
      <option value="1">Round 1</option>
      <option value="2">Round 2</option>
      <option value="3">Round 3</option>
      <option value="4">Round 4</option>
      <option value="5">Round 5</option>
    </select>
    <button type="submit">Predict Colleges</button>
  </form>

  <div id="results"></div>
  <input type="text" id="searchInput" placeholder="Search in results..." />
  <button id="downloadBtn">Download Results as PDF</button>
  <button id="downloadExcelBtn">Download Results as Excel</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <!-- Remaining JavaScript unchanged -->
</body>
</html>
